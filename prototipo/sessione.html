<!doctype html>
<!-- Autore: Giulio Occhipinti -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Session · EAS8 Lisbon</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="agenda">
<a class="skip-link" href="#contenuto">Skip to content</a>
<header class="site-header"></header>

<main id="contenuto">
  <section class="sezione">
    <div class="wrap" id="sessione">
      <!-- Riempito da script. Nel sito vero questa pagina e' HTML generato dal server. -->
      <p>Loading the session… <a href="agenda.html">Back to the programme</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap"><p>EAS8 Lisbon · European Aligner Society. Prototype with placeholder speakers and sessions.</p></div>
</footer>

<script src="prototipo.js"></script>
<script>
  CV.ready(function () {
    var D = CV.DATA, $ = CV.qs, s = CV.sessione(CV.param('id'));
    var box = $('#sessione');
    if (!s || !CV.giorno(s.g)) {
      box.innerHTML = '<h1 class="t-1">Session not found</h1><p class="misura">This link does not match any session in the programme.</p><p><a class="btn btn--primary" href="agenda.html">Back to the programme</a></p>';
      return;
    }
    document.title = s.titolo + ' · EAS8 Lisbon';
    var g = CV.giorno(s.g), prenotata = false, attesa = false;

    function durata(a, b) { return (CV.min(b) - CV.min(a)) + ' min'; }
    function sottosezioni() {
      if (!s.subs.length) return '';
      var h = '<section aria-labelledby="h-sub" class="stack"><h2 class="t-2" id="h-sub">Talks in this session</h2><div>';
      s.subs.forEach(function (x, i) {
        var fine = s.subs[i + 1] ? s.subs[i + 1].ora : s.a;
        h += '<details class="acc"><summary><time>' + x.ora + '</time> ' + x.titolo + CV.ic('chev') + '</summary><div class="acc__corpo"><p class="t-small"><b>Speaking:</b> ' + x.chi + '</p><p class="t-small t-muted">Length: ' + durata(x.ora, fine) + '</p></div></details>';
      });
      return h + '</div></section>';
    }

    box.innerHTML =
      '<nav class="breadcrumb" aria-label="Breadcrumb"><a href="agenda.html">Programme</a> / ' + g.lungo + '</nav>' +
      '<header class="stack" style="--stack:var(--s-3);margin-bottom:var(--s-5)">' +
      '<p class="sessione__tag">' + CV.chipTraccia(s.t) + CV.badgeAccesso(s) + '</p>' +
      '<h1 class="t-1">' + s.titolo + '</h1>' +
      '<dl class="meta-lista misura"><div><dt>When</dt><dd>' + g.lungo + ', <time>' + s.da + '</time>–<time>' + s.a + '</time></dd></div>' +
      '<div><dt>Where</dt><dd>' + CV.sala(s.sala).nome + ' (' + CV.sala(s.sala).nota + ')</dd></div>' +
      '<div><dt>Type</dt><dd>' + D.tipi[s.tipo] + '</dd></div>' +
      '<div><dt>Speakers</dt><dd>' + CV.nomiSpeaker(s) + '</dd></div></dl></header>' +
      '<div class="layout-2 layout-2--lato-primo">' +
      '<aside class="layout-2__lato" aria-label="Price and booking"><div class="scheda" id="azione"></div></aside>' +
      '<div class="stack" style="--stack:var(--s-6)">' +
      '<div class="stack"><p class="t-lead misura">' + s.desc + '</p></div>' + sottosezioni() +
      '<section aria-labelledby="h-sp"><h2 class="t-2" id="h-sp">Speakers</h2>' + s.sp.map(function (i) { return CV.speakerCard(CV.persona(i)); }).join('') + '</section>' +
      '</div></div>';

    function pannello() {
      var st = CV.stato, p = s.posti, pass = st.pass, h = '';
      if (!s.pagamento) {
        h += '<h2 class="t-3">Included in the pass</h2><p class="t-small">Open to full pass holders.</p><p>' + CV.postiHTML(s) + '</p>';
        if (!pass) {
          h += '<p class="t-small"><b>You need a pass to attend.</b> Full pass:</p>' + CV.prezzoHTML(D.prezzi.intero) +
            '<a class="btn btn--primary btn--block" href="biglietti.html">Buy a pass</a>';
        } else if (p.libero) {
          h += '<div class="avviso avviso--ok" role="status"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg><div><b>You have a pass.</b> No booking needed for this session.</div></div>';
        } else if (p.nd) {
          h += '<div class="avviso avviso--info"><svg class="ic" aria-hidden="true"><use href="#i-info"></use></svg><div>Booking for this session is not open yet.</div></div>' +
            '<button class="btn btn--block" aria-disabled="true">Booking not open yet</button>';
        } else if (prenotata) {
          h += '<div class="avviso avviso--ok" role="status"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg><div><b tabindex="-1" data-focus>Seat booked.</b> You will find it in your account and in a confirmation email.</div></div>' +
            '<button class="btn btn--secondary btn--block" data-azione="annulla">Cancel booking</button>';
        } else if (p.res === 0) {
          h += '<div class="avviso avviso--err"><svg class="ic" aria-hidden="true"><use href="#i-alert"></use></svg><div><b>Sold out.</b> If someone cancels, the seat becomes free again.</div></div>' +
            '<button class="btn btn--block" aria-disabled="true">Sold out</button>' +
            (attesa ? '<div class="avviso avviso--ok" role="status"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg><div><b tabindex="-1" data-focus>You are on the waiting list.</b> We will email you if a seat frees up.</div></div>'
                    : '<button class="btn btn--secondary btn--block" data-azione="attesa">Tell me if a seat frees up</button>');
        } else {
          h += '<button class="btn btn--primary btn--block" data-azione="prenota">Book my seat, free</button><p class="t-small t-muted">Booking keeps your seat. You can cancel at any time.</p>';
        }
      } else {
        h += '<h2 class="t-3">Paid workshop</h2><p class="t-small">Paid separately from the pass. 20 seats.</p>' + CV.prezzoHTML(s.pagamento) + '<p>' + CV.postiHTML(s) + '</p>';
        if (p.res === 0) {
          h += '<button class="btn btn--block" aria-disabled="true">Sold out</button>' +
            (attesa ? '<div class="avviso avviso--ok" role="status"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg><div><b tabindex="-1" data-focus>You are on the waiting list.</b> We will email you if a seat frees up.</div></div>'
                    : '<button class="btn btn--secondary btn--block" data-azione="attesa">Tell me if a seat frees up</button>');
        } else if (pass) {
          h += '<a class="btn btn--primary btn--block" href="biglietti.html?sessione=' + s.id + '&modo=aggiunta">Add to my pass</a>';
        } else {
          h += '<a class="btn btn--primary btn--block" href="biglietti.html?sessione=' + s.id + '&modo=solo">Buy this workshop</a>' +
            '<p class="t-small t-muted">You can buy it without a pass. <a href="biglietti.html">See the passes</a>.</p>';
        }
        h += '<p class="t-small t-muted">Card payment on Stripe (Apple Pay and Google Pay included). We never see your card details.</p>';
      }
      var a = $('#azione');
      a.innerHTML = h;
      var fo = a.querySelector('[data-focus]');
      if (fo && a.getAttribute('data-ha-agito')) fo.focus();
    }

    $('#azione').addEventListener('click', function (e) {
      var b = e.target.closest('[data-azione]');
      if (!b) return;
      var az = b.getAttribute('data-azione');
      if (az === 'prenota') { prenotata = true; if (s.posti.res) s.posti.res--; }
      if (az === 'annulla') { prenotata = false; if (typeof s.posti.res === 'number') s.posti.res++; }
      if (az === 'attesa') attesa = true;
      $('#azione').setAttribute('data-ha-agito', '1');
      pannello();
    });
    document.addEventListener('cv:stato', function () { $('#azione').removeAttribute('data-ha-agito'); pannello(); });
    pannello();
  });
</script>
</body>
</html>
