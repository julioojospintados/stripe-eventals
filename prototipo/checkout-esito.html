<!doctype html>
<!-- Autore: Giulio Occhipinti -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pagamento · Convegno 2027</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#contenuto">Vai al contenuto</a>
<header class="site-header">
  <div class="wrap site-header__in">
    <a class="brand" href="index.html" aria-label="Convegno 2027, pagina iniziale">Convegno 2027</a>
    <nav class="nav-main" aria-label="Principale">
      <a href="agenda.html"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg>Programma</a>
      <a href="speaker.html"><svg class="ic" aria-hidden="true"><use href="#i-person"></use></svg>Speaker</a>
      <a href="biglietti.html" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-ticket"></use></svg>Biglietti</a>
      <a href="membership.html"><svg class="ic" aria-hidden="true"><use href="#i-card"></use></svg>Membership</a>
    </nav>
    <span class="badge badge--ruolo">Vista: <span data-ruolo-label>Visitatore</span></span>
  </div>
</header>

<main id="contenuto">
  <section class="sezione">
    <div class="wrap" id="esito">
      <p>Caricamento… <a href="biglietti.html">Torna ai biglietti</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Convegno 2027 è un nome segnaposto. Persone, luoghi, date e prezzi di questo prototipo sono inventati.</p>
    <p>Condizioni di vendita, privacy e rimborsi: pagine in preparazione.</p>
  </div>
</footer>

<script src="prototipo.js"></script>
<script>
  /* Pagina di ritorno da Stripe Checkout. Stati: riuscito, elaborazione, annullato, fallito.
     Senza ?stato= mostra la simulazione della pagina ospitata da Stripe (nel sito vero e' una pagina di Stripe). */
  CV.ready(function () {
    var $ = CV.qs, box = $('#esito');
    var stato = CV.param('stato');
    var ord = null;
    try { ord = JSON.parse(sessionStorage.getItem('cv-ordine')); } catch (e) { ord = null; }
    var esempio = false;
    if (!ord) { ord = { righe: [{ t: 'Pass intero · Partecipante 1', v: CV.DATA.prezzi.intero.pub }], sconto: 0, totale: CV.DATA.prezzi.intero.pub }; esempio = true; }

    function avviso(tipo, icona, html, ruolo) {
      return '<div class="avviso avviso--' + tipo + '" role="' + ruolo + '"><svg class="ic" aria-hidden="true"><use href="#i-' + icona + '"></use></svg><div>' + html + '</div></div>';
    }
    function riepilogo() {
      var h = '<div class="riepilogo"><h2 class="t-3">Ordine</h2>';
      ord.righe.forEach(function (r) { h += '<div class="riepilogo__riga"><span>' + r.t + '</span><span>' + CV.euro(r.v) + '</span></div>'; });
      if (ord.sconto) h += '<div class="riepilogo__riga riepilogo__sconto"><span>Codice ' + ord.codice + '</span><span>−' + CV.euro(ord.sconto) + '</span></div>';
      h += '<div class="riepilogo__totale"><span>Totale</span><span>' + CV.euro(ord.totale) + '</span></div></div>';
      if (esempio) h += '<p class="t-small t-muted">Ordine d’esempio: non hai ancora preparato un ordine.</p>';
      return h;
    }
    function titolo(t) { return '<h1 class="t-1" tabindex="-1" id="h-esito">' + t + '</h1>'; }

    var h = '', titoloPagina = 'Pagamento';
    if (stato === 'riuscito') {
      titoloPagina = 'Pagamento riuscito';
      if (ord.membership) CV.setStato({ ruolo: 'membro' });
      h = '<div class="layout-2"><div class="stack">' + titolo('Pagamento riuscito') +
        avviso('ok', 'check', '<b>Grazie, è tutto a posto.</b> ' + (ord.membership ? 'La tua membership è attiva: da ora vedi i prezzi da membro.' : 'Ti abbiamo mandato la conferma via email, con i biglietti nominativi e il codice per entrare.'), 'status') +
        '<h2 class="t-2">Cosa fare adesso</h2><ol class="passi">' +
        (ord.membership
          ? '<li><span><b>Guarda i biglietti</b> con il tuo prezzo da membro.</span></li><li><span><b>Compra pass e sessioni</b> quando vuoi.</span></li>'
          : '<li><span><b>Controlla l’email</b> di conferma e conserva il codice di ingresso.</span></li><li><span><b>Prenota le sessioni incluse</b> a posti limitati: i posti non si tengono da soli.</span></li><li><span><b>Il giorno dell’evento</b> mostra il codice all’ingresso: lo leggiamo con il telefono.</span></li>') +
        '</ol><div class="btn-gruppo">' +
        (ord.membership ? '<a class="btn btn--primary" href="biglietti.html">Vai ai biglietti</a>' : '<a class="btn btn--primary" href="agenda.html">Prenota le sessioni</a>') +
        '<button class="btn" aria-disabled="true">I miei biglietti (area personale, in preparazione)</button></div>' +
        '</div><div class="layout-2__lato stack">' + riepilogo() + '<p class="t-small t-muted">Ricevuta e fattura: dati di fatturazione ancora da definire.</p></div></div>';
    } else if (stato === 'elaborazione') {
      titoloPagina = 'Pagamento in elaborazione';
      h = '<div class="layout-2"><div class="stack">' + titolo('Pagamento in elaborazione') +
        avviso('info', 'clock', '<b>Stiamo aspettando la conferma da Stripe.</b> Di solito arriva in pochi secondi; con alcuni metodi di pagamento può volerci di più.', 'status') +
        '<p class="misura"><b>Non pagare di nuovo.</b> Puoi chiudere la pagina: appena la conferma arriva ti scriviamo, e i biglietti compaiono nel tuo account.</p>' +
        '<div class="btn-gruppo"><a class="btn btn--primary" href="?stato=riuscito">Controlla di nuovo (simula: confermato)</a><a class="btn btn--secondary" href="agenda.html">Intanto guarda il programma</a></div>' +
        '</div><div class="layout-2__lato">' + riepilogo() + '</div></div>';
    } else if (stato === 'annullato') {
      titoloPagina = 'Pagamento annullato';
      h = '<div class="layout-2"><div class="stack">' + titolo('Hai annullato il pagamento') +
        avviso('warn', 'alert', '<b>Non ti abbiamo addebitato nulla.</b> L’ordine è ancora qui, puoi riprenderlo.', 'status') +
        '<p class="misura t-muted">I posti nelle sessioni a pagamento non vengono tenuti a lungo mentre l’ordine è aperto: durata da definire.</p>' +
        '<div class="btn-gruppo"><a class="btn btn--primary" href="biglietti.html">Torna al riepilogo</a><a class="btn btn--secondary" href="index.html">Vai alla home</a></div>' +
        '</div><div class="layout-2__lato">' + riepilogo() + '</div></div>';
    } else if (stato === 'fallito') {
      titoloPagina = 'Pagamento non riuscito';
      h = '<div class="layout-2"><div class="stack">' + titolo('Il pagamento non è andato a buon fine') +
        avviso('err', 'alert', '<b>La carta è stata rifiutata.</b> Non ti abbiamo addebitato nulla. Controlla i dati della carta, il plafond o prova un altro metodo.', 'alert') +
        '<div class="btn-gruppo"><a class="btn btn--primary" href="checkout-esito.html">Riprova il pagamento</a><a class="btn btn--secondary" href="biglietti.html">Torna al riepilogo</a></div>' +
        '</div><div class="layout-2__lato">' + riepilogo() + '</div></div>';
    } else {
      titoloPagina = 'Pagamento su Stripe (simulato)';
      h = titolo('Pagamento su Stripe') +
        '<p class="t-muted misura" style="margin:var(--s-3) 0 var(--s-5)">Nel sito vero qui si apre Stripe Checkout, una pagina ospitata da Stripe dove si inseriscono i dati della carta. Il riquadro sotto lo simula: scegli come deve andare.</p>' +
        '<div class="stripe-box"><div class="stripe-box__testa">Pagina ospitata da Stripe · simulazione, nessun pagamento reale</div><div class="stripe-box__corpo">' +
        '<div><p class="t-small" style="color:#4a5068">Paga Convegno 2027</p><p style="font:800 2rem/1.1 var(--font-display)">' + CV.euro(ord.totale) + '</p></div>' +
        ord.righe.map(function (r) { return '<div class="riepilogo__riga"><span>' + r.t + '</span><span>' + CV.euro(r.v) + '</span></div>'; }).join('') +
        (ord.sconto ? '<div class="riepilogo__riga"><span>Codice ' + ord.codice + '</span><span>−' + CV.euro(ord.sconto) + '</span></div>' : '') +
        '<p class="t-small" style="color:#4a5068">Qui Stripe chiede carta, email e dati di fatturazione. Il prototipo non ha campi di pagamento.</p>' +
        '<a class="btn btn--primary btn--block" href="?stato=riuscito">Simula: pagamento riuscito</a>' +
        '<a class="btn btn--block" href="?stato=elaborazione">Simula: in elaborazione</a>' +
        '<a class="btn btn--block" href="?stato=fallito">Simula: carta rifiutata</a>' +
        '<a class="btn btn--quiet btn--block" href="?stato=annullato">Torna al sito senza pagare</a>' +
        '</div></div>';
    }
    document.title = titoloPagina + ' · Convegno 2027';
    box.innerHTML = h;
    var t = $('#h-esito'); if (t) t.focus();
  });
</script>
</body>
</html>
