<!doctype html>
<!-- Autore: Giulio Occhipinti -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Speaker · Convegno 2027</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#contenuto">Vai al contenuto</a>
<header class="site-header">
  <div class="wrap site-header__in">
    <a class="brand" href="index.html" aria-label="Convegno 2027, pagina iniziale">Convegno 2027</a>
    <nav class="nav-main" aria-label="Principale">
      <a href="agenda.html"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg>Programma</a>
      <a href="speaker.html" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-person"></use></svg>Speaker</a>
      <a href="biglietti.html"><svg class="ic" aria-hidden="true"><use href="#i-ticket"></use></svg>Biglietti</a>
      <a href="membership.html"><svg class="ic" aria-hidden="true"><use href="#i-card"></use></svg>Membership</a>
    </nav>
    <span class="site-header__destra"><a class="header-link" href="account.html">Account</a><span class="badge badge--ruolo"><span class="solo-desktop">Vista: </span><span data-ruolo-label>Visitatore</span></span></span>
  </div>
</header>

<main id="contenuto">
  <section class="sezione">
    <div class="wrap" id="scheda">
      <p>Caricamento… <a href="speaker.html">Torna agli speaker</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Convegno 2027 è un nome segnaposto. Persone, luoghi, date e prezzi di questo prototipo sono inventati.</p>
    <p>Condizioni di vendita, privacy e rimborsi: pagine in preparazione.</p>
  </div>
</footer>

<script src="prototipo.js"></script>
<script>
  CV.ready(function () {
    var D = CV.DATA, p = CV.persona(CV.param('id')), box = CV.qs('#scheda');
    if (!p) {
      box.innerHTML = '<h1 class="t-1">Speaker non trovato</h1><p><a class="btn btn--primary" href="speaker.html">Torna agli speaker</a></p>';
      return;
    }
    document.title = p.nome + ' · Convegno 2027';
    var sess = D.sessioni.filter(function (s) { return s.sp.indexOf(p.id) > -1; });
    function sessioni() {
      CV.qs('#sessioni-speaker').innerHTML = sess.map(function (s) { return CV.sessioneRiga(s, { giorno: true }); }).join('');
    }
    box.innerHTML =
      '<nav class="breadcrumb" aria-label="Percorso"><a href="speaker.html">Speaker</a></nav>' +
      '<div class="layout-2 layout-2--lato-primo" style="margin-top:var(--s-3)">' +
      '<div class="layout-2__lato"><div class="ritratto ritratto--grande" data-tono="' + p.tono + '" role="img" aria-label="Ritratto segnaposto di ' + p.nome + ': foto da inserire">' + CV.iniziali(p.nome) + '</div>' +
      '<p class="t-small t-muted" style="margin-top:var(--s-2)">Foto da inserire.</p></div>' +
      '<div class="stack" style="--stack:var(--s-4)"><h1 class="t-1">' + p.nome + '</h1>' +
      '<p class="t-lead">' + p.ruolo + ', ' + p.ente + '</p>' +
      p.bio.map(function (t) { return '<p class="misura">' + t + '</p>'; }).join('') +
      '</div></div>' +
      '<section aria-labelledby="h-int" style="margin-top:var(--s-7)"><h2 class="t-2" id="h-int">Interviene in ' + sess.length + (sess.length === 1 ? ' sessione' : ' sessioni') + '</h2><div id="sessioni-speaker"></div></section>';
    sessioni();
    document.addEventListener('cv:stato', sessioni);
  });
</script>
</body>
</html>
