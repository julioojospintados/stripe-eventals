; Worker della coda di EAS8 sotto supervisor, alternativa a eas8-queue.service (usane uno solo).
; Autore: Giulio Occhipinti. Installazione: sudo cp supervisor-eas8-queue.conf /etc/supervisor/conf.d/eas8-queue.conf
; poi sudo supervisorctl reread && sudo supervisorctl update. Adatta utente e percorsi.
[program:eas8-queue]
command=/usr/bin/php /home/eas8/eas8/current/artisan queue:work --queue=critical,default --sleep=3 --tries=5 --max-time=3600 --memory=192
directory=/home/eas8/eas8/current
user=eas8
numprocs=1
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
; Un job in corso ha tempo di finire prima dello stop.
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/home/eas8/eas8/current/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
