# nginx per EAS8 con PHP-FPM e HTTPS (Let's Encrypt via certbot). Autore: Giulio Occhipinti.
# Adatta: server_name, percorso di current, socket di PHP-FPM. Installazione e certificato: README.md qui accanto.
# Staging: una copia con il suo server_name e il suo percorso, più le righe segnate «staging».

server {
    listen 80;
    listen [::]:80;
    server_name eas8.example.org;
    # certbot --nginx gestisce da solo la verifica su /.well-known/acme-challenge/.
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04); dalla 1.25.1 si può scrivere «http2 on;» al posto di «http2» qui.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eas8.example.org;

    ssl_certificate     /etc/letsencrypt/live/eas8.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eas8.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Link al rilascio attivo (o al clone in modalità git pull); $realpath_root segue il link dopo ogni deploy.
    root /home/eas8/eas8/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Import CSV del programma e foto dei relatori (Livewire accetta fino a 12 MB); vale anche per il webhook di
    # Stripe, che non ha bisogno di un limite di frequenza: è firmato e Stripe ritenta da solo.
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # staging: add_header X-Robots-Tag "noindex, nofollow" always;

    # File nascosti (.env, .git, .htaccess…): mai serviti; resta aperto solo .well-known.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset statici: cache nel browser. «expires» non usa add_header, quindi gli header di sicurezza restano.
    # CSS e JS hanno nomi fissi (site.css, Filament con ?v=): cache breve; font e immagini più lunga.
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 1d;
        access_log off;
    }
    location ~* \.(?:woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Solo il front controller di Laravel va a PHP; qualsiasi altro .php risponde 404.
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ {
        return 404;
    }

    error_page 404 /index.php;
}
