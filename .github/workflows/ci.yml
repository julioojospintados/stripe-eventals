# CI di sito/: dipendenze, stile, analisi statica e test su MariaDB e MySQL. Autore: Giulio Occhipinti.
# Nessun segreto: Stripe e SMTP sono finti nei test. Azioni fissate per SHA (versione nel commento).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sito

jobs:
  checks:
    name: Audit, Pint, PHPStan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, sodium, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Test (${{ matrix.db.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db:
          # MariaDB 11.4 LTS è il riferimento (server del cliente); 10.11 e MySQL 8.0 restano compatibili.
          - { name: 'MariaDB 11.4', image: 'mariadb:11.4', connection: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { name: 'MariaDB 10.11', image: 'mariadb:10.11', connection: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { name: 'MySQL 8.0', image: 'mysql:8.0', connection: mysql, health: 'mysqladmin ping -h 127.0.0.1 -proot' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: eas8_test
          MYSQL_DATABASE: eas8_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # root: con il log binario di MySQL 8 un utente normale non crea trigger (errore 1419).
      DB_CONNECTION: ${{ matrix.db.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, sodium, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
